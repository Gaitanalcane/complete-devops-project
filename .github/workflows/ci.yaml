--- 
name: complet Devops Project Pipeline 


on:
  push:
    branches:
      - main 
jobs:
  build_and_push:
    run-on: ubuntu_latest 
    steps:
    - name: checkout Code 
      uses: actions/checkout@v2
    - name: Set Short SHA 
      run: |
       echo "SHORT_SHA=$(echo ${GIHUB_SHA})| cut -c1-7)" >> $GITHUB_ENV
    - name: built Docker Image 
      run: |
        docker built -t alcanegaitan/complete-devops-projets:${{en.SHORT_SHA }} .
    - name: login to Dockerhub
      run: |
        echo "${{ secrets.DOCKERHUB_TOKEN}}" docker login -u "${{ secret.DOCKERHUB_USENAME }}" --password-stdin
    - name: push to Dockerhub
      run: |
        docker push alcanegaitan/complete-devops-projets:${{en.SHORT_SHA }} 
        